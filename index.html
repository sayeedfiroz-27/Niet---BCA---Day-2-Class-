<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIET BCA Day 3 - Python Operators, Loops and Marks Project</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --paper: #ffffff;
      --text: #1f2937;
      --muted: #5f6b7a;
      --border: #d8dee8;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --green: #1f7a4d;
      --cream: #fff8e8;
      --mint: #eaf8f1;
      --code-bg: #0f172a;
      --code-text: #e5e7eb;
      --table-head: #eef2ff;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.7;
      font-size: 16px;
    }

    .topbar {
      background: #111827;
      color: white;
      padding: 18px 24px;
      border-bottom: 4px solid var(--accent);
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
    }

    .topbar h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.3;
      color: white;
    }

    .topbar p {
      margin: 6px 0 0;
      color: #d1d5db;
      font-size: 15px;
    }

    main {
      max-width: 1120px;
      margin: 28px auto;
      padding: 0 18px 48px;
    }

    article {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    h1, h2, h3 {
      line-height: 1.25;
      color: #111827;
    }

    article > h1 {
      font-size: 34px;
      margin-top: 0;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    h2 { margin-top: 34px; font-size: 25px; }
    h3 { margin-top: 26px; font-size: 20px; }
    p { margin: 12px 0; }
    a { color: var(--accent); }

    .doc-selector {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .doc-card {
      appearance: none;
      width: 100%;
      min-height: 132px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--paper);
      color: var(--text);
      cursor: pointer;
      padding: 18px;
      text-align: left;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
      transition: border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }

    .doc-card:hover, .doc-card:focus {
      border-color: var(--accent);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.14);
      outline: none;
      transform: translateY(-1px);
    }

    .doc-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
    }

    .doc-card strong {
      display: block;
      font-size: 18px;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .doc-card span {
      display: block;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .viewer-heading {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 15px;
    }

    .loading, .error {
      color: var(--muted);
      font-size: 18px;
    }

    .error { color: #b91c1c; }

    .toc, .card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin: 22px 0;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
    }

    .toc h2, .card h2 { margin-top: 0; }
    .toc a { text-decoration: none; }
    .toc li { margin: 4px 0; }

    .topic {
      margin-top: 42px;
      padding: 16px 18px;
      background: #111827;
      color: white;
      border-radius: 8px;
      font-size: 24px;
    }

    .subtopic { color: var(--accent-dark); }

    .box {
      border-radius: 8px;
      padding: 15px 18px;
      margin: 16px 0;
      border-left: 5px solid var(--accent);
      background: #eff6ff;
    }

    .box.project { background: var(--cream); border-left-color: #d28a18; }
    .box.use { background: var(--mint); border-left-color: var(--green); }
    .tag {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #405166;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .example-title {
      display: inline-block;
      background: var(--green);
      color: white;
      border-radius: 6px;
      padding: 7px 14px;
      margin: 18px 0 8px;
      font-size: 16px;
    }

    .run-loc {
      display: inline-block;
      background: #0d1728;
      color: #fff;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px 6px 0 0;
    }

    code {
      background: #eef2f7;
      border-radius: 4px;
      padding: 2px 5px;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 0.95em;
    }

    pre {
      background: var(--code-bg);
      color: var(--code-text);
      border-radius: 0 8px 8px 8px;
      padding: 16px;
      overflow-x: auto;
      line-height: 1.55;
      font-size: 14px;
      margin: 0 0 16px;
    }

    pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0 28px;
      display: block;
      overflow-x: auto;
      background: white;
      font-size: 14.5px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--table-head);
      font-weight: 700;
    }

    td:first-child {
      width: 58px;
      text-align: center;
      font-weight: 700;
    }

    blockquote {
      border-left: 4px solid var(--accent);
      margin: 16px 0;
      padding: 8px 16px;
      background: #eff6ff;
      color: var(--muted);
    }

    hr, .sep {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }

    @media (max-width: 700px) {
      .topbar { padding: 16px; }
      .topbar h1 { font-size: 20px; }
      main { margin: 16px auto; padding: 0 12px 32px; }
      article { padding: 18px; }
      article > h1 { font-size: 26px; }
      h2 { font-size: 22px; }
      .topic { font-size: 20px; }
      .doc-selector { grid-template-columns: 1fr; }
      th, td { min-width: 140px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>NIET BCA Day 3 - Python Operators, Conditions, Loops and Marks Project</h1>
      <p>Reference-style notes viewer with complete notes, beginner-friendly notes, proper Hinglish notes, productive examples, outputs, and detailed code explanation.</p>
    </div>
  </header>

  <main>
    <section class="doc-selector" aria-label="Choose notes document">
      <button class="doc-card" type="button" data-doc="complete">
        <strong>1. Complete Notes</strong>
        <span>Full Day 3 notes with all topics, project flow, practical code, output, and detailed explanations.</span>
      </button>
      <button class="doc-card" type="button" data-doc="beginner">
        <strong>2. Beginner Friendly Notes</strong>
        <span>Easy learner version with real-life examples, step-by-step flow, and detailed code explanation.</span>
      </button>
      <button class="doc-card" type="button" data-doc="hinglish">
        <strong>3. Proper Hinglish Notes</strong>
        <span>Classroom-style Hinglish explanation for direct teaching and revision.</span>
      </button>
    </section>

    <article id="content">
      <p class="loading">Choose one document above to open the notes.</p>
    </article>
  </main>

  <script>
    const content = document.getElementById("content");
    const cards = Array.from(document.querySelectorAll(".doc-card"));
    const documents = {
      complete: {
        title: "Complete Notes",
        file: "day3_complete_notes.md"
      },
      beginner: {
        title: "Beginner Friendly Notes",
        file: "day3_beginner_friendly_notes.md"
      },
      hinglish: {
        title: "Proper Hinglish Notes",
        file: "day3_proper_hinglish_notes.md"
      }
    };

    function setActiveCard(docKey) {
      cards.forEach((card) => {
        card.classList.toggle("active", card.dataset.doc === docKey);
      });
    }

    function renderMarkdown(markdown) {
      return markdown;
    }

    function loadDocument(docKey) {
      const selected = documents[docKey] || documents.beginner;
      const safeKey = documents[docKey] ? docKey : "beginner";
      setActiveCard(safeKey);
      content.innerHTML = `<p class="loading">Loading ${selected.title}...</p>`;

      fetch(selected.file)
        .then((response) => {
          if (!response.ok) {
            throw new Error("Notes file could not be loaded.");
          }
          return response.text();
        })
        .then((markdown) => {
          content.innerHTML = `
            <p class="viewer-heading">Opened document: ${selected.title}</p>
            ${renderMarkdown(markdown)}
          `;
          window.location.hash = safeKey;
          window.scrollTo({ top: 0, behavior: "smooth" });
        })
        .catch((error) => {
          content.innerHTML = `
            <h1>Notes could not be loaded</h1>
            <p class="error">${error.message}</p>
            <p>Please run this folder with a local server and check that the selected Markdown file exists in the same folder as this page.</p>
          `;
        });
    }

    cards.forEach((card) => {
      card.addEventListener("click", () => {
        loadDocument(card.dataset.doc);
      });
    });

    const initialDoc = window.location.hash.replace("#", "") || "beginner";
    loadDocument(documents[initialDoc] ? initialDoc : "beginner");
  </script>
</body>
</html>
